<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one thumb-reachable column, logger rows sized for a phone held between sets. Accents borrow competition plate colours. */
:root{
  --bg:#eceff2;--surface:#fff;--sunk:#dfe4e9;--ink:#14202e;--muted:#566474;--line:#cdd4db;
  --accent:#1c4fc4;--on-accent:#fff;--done:#d3efdc;--done-ink:#11613a;--danger:#b3261e;--pr:#8a5a00;--pr-bg:#fbeec9;
  --p25:#c8202c;--p20:#1c4fc4;--p15:#e6b400;--p10:#1f8a4c;--p5:#f4f5f6;--p2:#2a2f36;--p1:#9aa3ad;--pedge:#14202e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c;--surface:#1b222a;--sunk:#0b0f14;--ink:#eaeef2;--muted:#9aa7b4;--line:#303a45;
  --accent:#7ba3ff;--on-accent:#08152f;--done:#123a26;--done-ink:#8fe0b1;--danger:#ff8a80;--pr:#f5cf72;--pr-bg:#3d3010;--pedge:#000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c;--surface:#1b222a;--sunk:#0b0f14;--ink:#eaeef2;--muted:#9aa7b4;--line:#303a45;
  --accent:#7ba3ff;--on-accent:#08152f;--done:#123a26;--done-ink:#8fe0b1;--danger:#ff8a80;--pr:#f5cf72;--pr-bg:#3d3010;--pedge:#000;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:34px;letter-spacing:.01em}h2{font-size:23px}h3{font-size:19px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:14px}.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;background:var(--sunk);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}.btn.danger{color:var(--danger)}.btn.wide{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:none;color:var(--accent)}
input.field,select.field,textarea.field{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
textarea.field{min-height:64px;resize:vertical}
.panel{background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:-12px;padding-block:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.head input{flex:1;min-width:0;border:0;background:none;font:700 23px var(--display);padding:4px 0}
.head h2{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-inline:env(safe-area-inset-left,0px) env(safe-area-inset-right,0px)}
nav button{flex:1;max-width:180px;min-height:56px;font-size:14px;font-weight:600;color:var(--muted)}
nav button[aria-current]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.resume{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--on-accent);min-height:46px;width:100%;font-weight:600;padding-inline:16px}
.routine{display:flex;flex-direction:column;gap:6px}
.routine .act{display:flex;gap:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:34px minmax(0,1fr) 64px 58px 40px 24px;gap:6px;align-items:center}
.grid.one{grid-template-columns:34px minmax(0,1fr) 92px 40px 24px}
.grid.t{grid-template-columns:34px 76px 76px 24px}.grid.t.one{grid-template-columns:34px 100px 24px}
.grid .hd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}.grid .hd.l{text-align:left}
.setrow{border-radius:6px;padding-block:3px}.setrow.done{background:var(--done)}
.setrow input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:center;font-size:16px;font-weight:600;padding:0;font-variant-numeric:tabular-nums}
.setrow input::placeholder{color:var(--muted);font-weight:400}
.setrow.done input{border-color:transparent;background:none}
.stype{height:40px;font-weight:700;border-radius:6px;font-variant-numeric:tabular-nums}.stype.w{color:var(--pr)}.stype.d,.stype.f{color:var(--danger)}
.prev{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chk{width:40px;height:40px;border-radius:6px;background:var(--sunk);font-weight:700;color:var(--muted)}.setrow.done .chk{background:var(--done-ink);color:var(--done)}
.x{height:40px;color:var(--muted);font-size:18px}
.exhead{display:flex;align-items:center;gap:8px}.exname{flex:1;min-width:0;text-align:left;font:700 20px var(--display);color:var(--accent)}
.note{border:0;background:none;width:100%;font-size:14px;color:var(--muted);padding:2px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:34px;padding:0 12px;border-radius:17px;background:var(--sunk);font-size:14px;font-weight:500}.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{background:var(--surface);border-radius:10px}.item{display:flex;width:100%;min-height:56px;gap:10px;align-items:center;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}.list>.item:last-child{border-bottom:0}.item.sel{background:var(--done)}
.tag{font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--pr-bg);color:var(--pr)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stats b{display:block;font:700 26px var(--display);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tbl td{padding:3px 0}.tbl td:first-child{width:30px;color:var(--muted);font-weight:600}
.chart{position:relative;touch-action:pan-y}.chart svg{display:block;width:100%}.chart text{fill:var(--muted);font:12px var(--body)}
.tip{position:absolute;top:0;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px}
.restbar b{font:700 30px var(--display);flex:1;font-variant-numeric:tabular-nums}.restbar button{min-height:40px;padding:0 12px;border-radius:6px;background:color-mix(in srgb,var(--bg) 18%,transparent);font-weight:600}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.bar{overflow-x:auto}.plate{stroke:var(--pedge);stroke-width:1}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheetbox{animation:up .16s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>
</head><body>

<script>
const LIB=`Bench Press (Barbell)|Chest
Bench Press (Dumbbell)|Chest
Incline Bench Press (Barbell)|Chest
Incline Bench Press (Dumbbell)|Chest
Decline Bench Press (Barbell)|Chest
Chest Press (Machine)|Chest
Chest Fly (Dumbbell)|Chest

T Bar Row|Back

Overhead Press (Barbell)|Shoulders
Overhead Press (Dumbbell)|Shoulders
Seated Overhead Press (Dumbbell)|Shoulders
Shoulder Press (Machine)|Shoulders
Lateral Raise (Dumbbell)|Shoulders
Lateral Raise (Cable)|Shoulders
Front Raise (Dumbbell)|Shoulders
Rear Delt Reverse Fly (Dumbbell)|Shoulders
Bicep Curl (Barbell)|Arms
Bicep Curl (Dumbbell)|Arms
Bicep Curl (Cable)|Arms
Hammer Curl (Dumbbell)|Arms
Preacher Curl (Barbell)|Arms
Triceps Pushdown|Arms
Triceps Rope Pushdown|Arms
Overhead Triceps Extension (Cable)|Arms
Skullcrusher (Barbell)|Arms
Triceps Dip|Arms|reps
Squat (Barbell)|Legs
Front Squat|Legs
Goblet Squat|Legs
Hack Squat (Machine)|Legs
V Squat (Machine)|Legs
Leg Press (Machine)|Legs
Bulgarian Split Squat|Legs
Walking Lunge (Dumbbell)|Legs
Leg Extension (Machine)|Legs
Lying Leg Curl (Machine)|Legs
Seated Leg Curl (Machine)|Legs
Hip Thrust (Barbell)|Legs
Standing Calf Raise (Machine)|Legs
Seated Calf Raise|Legs
Plank|Core|time
Crunch|Core|reps
Hanging Leg Raise|Core|reps
Cable Crunch|Core
Russian Twist (Weighted)|Core
Ab Wheel|Core|reps
Treadmill|Cardio|cardio
Cycling|Cardio|cardio
Rowing Machine|Cardio|cardio
Elliptical Trainer|Cardio|cardio
Stair Machine|Cardio|time
Jump Rope|Cardio|time`.split('\n').map(l=>{const[name,muscle,type]=l.split('|');return{name,muscle,type:type||'weight'}});
const MUSCLES=['Chest','Back','Shoulders','Arms','Legs','Core','Cardio','Other'];
const FIELDS={weight:['w','r'],reps:['r'],time:['t'],cardio:['d','t']};
const TYPES=['n','w','d','f'];
const LB=2.20462;

/* ---------- state and persistence ---------- */
const S={profile:{routines:[],customExercises:[],settings:{unit:'kg',rest:120,bar:20}},workouts:{},active:null};
const DEF_SETTINGS={unit:'kg',rest:120,bar:20};
let dbp=null;
function openDb(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('liftbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
const kvGet=k=>openDb().then(d=>new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const kvSet=(k,v)=>openDb().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
const clone=o=>JSON.parse(JSON.stringify(o));
let cacheT,activeT,saveFailed=false;
function flush(){clearTimeout(cacheT);cacheT=null;return kvSet('state',clone(S)).then(()=>{saveFailed=false}).catch(()=>{if(!saveFailed)toast('Could not save to this phone. Export a backup from Settings.');saveFailed=true})}
function cache(){clearTimeout(cacheT);cacheT=setTimeout(flush,300)}
const mark=()=>cache();
const saveProfile=()=>cache();
const saveWorkout=()=>{histMemo=null;cache()};
function touchActive(){cache()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cacheT)flush()});
addEventListener('pagehide',()=>{if(cacheT)flush()});

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};
const $=q=>document.querySelector(q);
const unit=()=>S.profile.settings.unit;
const uf=()=>unit()==='lb'?LB:1;
const trim=(n,d=2)=>+(+n).toFixed(d);
const dispW=kg=>trim(kg*uf());
const has=v=>v!==''&&v!=null;
const big=n=>Math.round(n).toLocaleString();
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const shortDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s/60)%60,x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const dur=ms=>{const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`};
function exInfo(n){return LIB.find(e=>e.name===n)||S.profile.customExercises.find(e=>e.name===n)||{name:n,muscle:'Other',type:'weight'}}
const allEx=()=>[...LIB,...S.profile.customExercises];
function fmtSet(s,type){
  if(type==='weight')return has(s.w)?`${dispW(s.w)} × ${s.r??0}`:`${s.r??0} reps`;
  if(type==='reps')return (has(s.w)&&s.w>0?`+${dispW(s.w)} × `:'')+`${s.r??0} reps`;
  if(type==='time')return clock((s.t||0)*1000);
  return `${trim(s.d||0)} km · ${clock((s.t||0)*1000)}`;
}
const toInput=(f,v,type)=>!has(v)?'':f==='w'?dispW(v):f==='t'&&type==='cardio'?trim(v/60):v;
const fromInput=(f,raw,type)=>{const n=parseFloat(raw);if(isNaN(n)||n<0)return'';return f==='w'?n/uf():f==='t'&&type==='cardio'?n*60:n};
const fieldLabel=(f,type)=>f==='w'?unit():f==='r'?'reps':f==='d'?'km':type==='cardio'?'min':'sec';
const carriageOf=ex=>+(S.profile.carriage||{})[ex]||0;
const carriageNote=ex=>{const c=carriageOf(ex);return c?`<p class="muted small num">+${dispW(c)} ${unit()} carriage counted in totals and records</p>`:''};
const e1rm=(s,c=0)=>{const w=(+s.w||0)+c;return (has(s.w)||c)&&s.r>0?(s.r===1?w:w*(1+s.r/30)):0};
const isWork=s=>s.type!=='w';

let histMemo=null;
function hist(){
  if(histMemo)return histMemo;
  const m=new Map();
  Object.values(S.workouts).sort((a,b)=>b.start-a.start).forEach(w=>(w.exercises||[]).forEach(x=>{
    if(!m.has(x.ex))m.set(x.ex,[]);m.get(x.ex).push({id:w.id,start:w.start,sets:x.sets})}));
  return histMemo=m;
}
const lastSets=(ex,skip)=>{const h=(hist().get(ex)||[]).find(e=>e.id!==skip);return h?h.sets:[]};
function bests(entries,c=0){
  let w=0,one=0,vol=0,r=0;
  entries.forEach(e=>e.sets.filter(isWork).forEach(s=>{const l=(+s.w||0)+c;w=Math.max(w,l);one=Math.max(one,e1rm(s,c));vol=Math.max(vol,l*(s.r||0));r=Math.max(r,s.r||0)}));
  return{w,one,vol,r};
}
function prsFor(wk){
  const out=[];
  (wk.exercises||[]).forEach(x=>{
    const type=exInfo(x.ex).type;if(type!=='weight')return;
    const prior=(hist().get(x.ex)||[]).filter(e=>e.start<wk.start);if(!prior.length)return;
    const c=carriageOf(x.ex),b=bests(prior,c),n=bests([{sets:x.sets}],c),got=[];
    if(n.w>b.w)got.push(`heaviest ${dispW(n.w)} ${unit()}`);
    if(n.one>b.one+.01)got.push(`est. 1RM ${dispW(trim(n.one,1))} ${unit()}`);
    if(got.length)out.push({ex:x.ex,got});
  });
  return out;
}
const volume=w=>(w.exercises||[]).reduce((a,x)=>{const c=carriageOf(x.ex);return a+x.sets.filter(isWork).reduce((b,s)=>b+((+s.w||0)+c)*(s.r||0),0)},0);
const setCount=w=>(w.exercises||[]).reduce((a,x)=>a+x.sets.filter(isWork).length,0);
const sortedW=()=>Object.values(S.workouts).sort((a,b)=>b.start-a.start);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- screens ---------- */
let tab='train',screens=[],draft=null,exq='',exm='All',rest=null,chartData=null,metric='one',audio=null,lock=null;
const top_=()=>screens[screens.length-1];
const curDoc=()=>{for(let i=screens.length-1;i>=0;i--){const k=screens[i].k;if(k==='logger')return S.active;if(k==='edit'||k==='routine')return draft}return null};
function push(s){if(top_())top_().y=scrollY;else tabY=scrollY;screens.push(s);render();scrollTo(0,0)}
function pop(){screens.pop();render();scrollTo(0,top_()?top_().y||0:tabY)}
let tabY=0;
function softRender(){const k=top_()&&top_().k;if(!$('#sheet').hidden||['logger','edit','routine','picker'].includes(k)||document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;render()}
function render(){
  const y=scrollY,s=top_();chartData=null;
  $('#app').innerHTML=!s?TABS[tab]():SCREENS[s.k](s);
  document.body.querySelectorAll('nav,.resume,.restbar').forEach(n=>n.remove());
  if(!s){document.body.insertAdjacentHTML('beforeend',(S.active?`<button class="resume num" data-act="resume">Workout in progress · <span id="rclock">${clock(Date.now()-S.active.start)}</span> · Resume</button>`:'')+
    `<nav aria-label="Main">${[['train','Train'],['history','History'],['exercises','Exercises'],['settings','Settings']].map(([k,l])=>`<button data-act="tab" data-t="${k}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`)}
  if(s&&s.k==='logger')renderRest();
  scrollTo(0,y);bindChart();
}
const TABS={
train(){
  const rs=S.profile.routines,groups={};
  rs.forEach(r=>(groups[r.program||'My routines']=groups[r.program||'My routines']||[]).push(r));
  const weekStart=mondayOf(Date.now()),n=sortedW().filter(w=>w.start>=weekStart).length;
  const bk=S.profile.lastBackup,due=sortedW().length&&(!bk||Date.now()-bk>12096e5);
  return `<div class="row between"><h1>Train</h1><span class="muted small num">${n} this week</span></div>
  ${due?`<section class="panel"><p class="small">${bk?'Your last backup was over two weeks ago.':'You haven’t backed up yet.'} Your workouts are stored only on this phone.</p><button class="btn sm" data-act="exportJson">Save a backup</button></section>`:''}
  <button class="btn primary wide" data-act="startEmpty">Start empty workout</button>
  ${rs.length?Object.entries(groups).map(([g,list])=>`<section class="stack"><div class="label">${esc(g)}</div>${list.map(routineCard).join('')}</section>`).join('')+
    `<button class="btn wide" data-act="newRoutine">New routine</button>`:
  `<section class="panel"><h2>Set up your programs</h2><p class="muted">A routine is a saved list of exercises and sets. Start one and each set shows what you lifted last time.</p>
   <button class="btn primary" data-act="newRoutine">Create a routine</button>
   <button class="btn" data-act="starter">Add a Push, Pull, Legs starter</button>
   <div class="btn file">Import Hevy history (CSV)<input id="hevyFile2" type="file" accept=".csv,text/csv" data-file="hevy" aria-label="Import Hevy CSV"></div></section>`}`;
},
history(){
  const ws=sortedW();

function exRows(q,m,act,sel){

  let l=allEx().filter(e=>(m==='All'||e.muscle===m)&&(!q||q.split(/\s+/).every(t=>e.name.toLowerCase().includes(t))));
  l.sort((a,b)=>((h.get(b.name)||[]).length-(h.get(a.name)||[]).length)||a.name.localeCompare(b.name));
  if(!l.length)return `<div class="item muted">No match. Add it as a custom exercise.</div>`;
  return l.map(e=>{const c=(h.get(e.name)||[]).length,on=sel&&sel.includes(e.name);
    return `<button class="item${on?' sel':''}" data-act="${act}" data-name="${esc(e.name)}" ${sel?`aria-pressed="${!!on}"`:''}><span class="grow"><b>${esc(e.name)}</b><br><span class="muted small">${esc(e.muscle)}${c?` · logged ${c}×`:''}</span></span>${on?'<b>✓</b>':''}</button>`}).join('');
}

const localDT=t=>{const d=new Date(t-new Date(t).getTimezoneOffset()*60000);return d.toISOString().slice(0,16)};
function mondayOf(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d}

/* ---------- charts ---------- */
const chartW=()=>Math.min(innerWidth,720)-60;
function niceTicks(lo,hi,n){const span=(hi-lo)||1,raw=span/n,mag=10**Math.floor(Math.log10(raw)),st=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw);const a=Math.floor(lo/st)*st,out=[];for(let v=a;v<=hi+st*.999;v+=st)out.push(+v.toFixed(6));return out}
function weekChart(ws){
  const W=chartW(),H=130,L=22,B=20,wk=604800000,n=W<420?10:14,end=mondayOf(Date.now()),weeks=[];
  for(let i=n-1;i>=0;i--){const st=mondayOf(end-i*wk+3600000*12);weeks.push({st,c:ws.filter(w=>w.start>=st&&w.start<st+wk+3600000).length})}
  weeks.forEach((w,i)=>{if(weeks[i+1])w.c=ws.filter(x=>x.start>=w.st&&x.start<weeks[i+1].st).length});
  const max=Math.max(4,...weeks.map(w=>w.c)),bw=(W-L)/n,y=v=>(H-B)-(v/max)*(H-B-8);
  chartData={pts:weeks.map((w,i)=>({px:L+bw*(i+.5),text:`Week of ${shortDate(w.st)}: ${w.c} workout${w.c===1?'':'s'}`}))};
  const ticks=[0,Math.ceil(max/2),max];
  return `<div class="chart" data-chart role="img" aria-label="Workouts per week for the last ${n} weeks"><svg viewBox="0 0 ${W} ${H}" height="${H}">
   ${ticks.map(t=>`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
   ${weeks.map((w,i)=>w.c?`<rect x="${L+bw*i+bw*.2}" width="${bw*.6}" y="${y(w.c)}" height="${y(0)-y(w.c)}" rx="3" fill="var(--accent)"/>`:'').join('')}
   ${weeks.map((w,i)=>i%Math.ceil(n/4)===n%Math.ceil(n/4)-1+0||i===n-1?`<text x="${Math.min(L+bw*(i+.5),W-22)}" y="${H-5}" text-anchor="middle">${shortDate(w.st)}</text>`:'').join('')}
  </svg><div class="tip" hidden></div></div>`;
}
function lineChart(pts){
  if(pts.length<2)return `<p class="muted small">Log this exercise twice to see a trend.</p>`;
  const W=chartW(),H=200,L=44,R=12,T=12,B=22,xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),tk=niceTicks(Math.min(...ys),Math.max(...ys),3),y0=tk[0],y1=tk[tk.length-1];
  const x=v=>L+(v-x0)/((x1-x0)||1)*(W-L-R),y=v=>T+(1-(v-y0)/((y1-y0)||1))*(H-T-B);
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(p.x).toFixed(1)} ${y(p.y).toFixed(1)}`).join(' ');
  const lab=metric==='v'?'volume':metric==='w'?'heaviest':'est. 1RM';
  chartData={pts:pts.map(p=>({px:x(p.x),text:`${shortDate(p.x)}: ${trim(p.y,1)} ${unit()} ${lab}`}))};
  const end=pts[pts.length-1];
  return `<div class="chart" data-chart role="img" aria-label="${lab} over time, latest ${trim(end.y,1)} ${unit()}"><svg viewBox="0 0 ${W} ${H}" height="${H}">
  ${tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${big(t)}</text>`).join('')}
  <path d="${path} L${x(end.x)} ${H-B} L${x(x0)} ${H-B}Z" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="${x(end.x)}" cy="${y(end.y)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
  <text x="${L}" y="${H-5}">${shortDate(x0)}</text><text x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(x1)}</text></svg><div class="tip" hidden></div></div>`;
}
function bindChart(){
  const el=$('[data-chart]');if(!el||!chartData)return;const data=chartData,tip=el.querySelector('.tip'),svg=el.querySelector('svg');
  const show=e=>{const r=svg.getBoundingClientRect(),sc=r.width/svg.viewBox.baseVal.width,px=(e.clientX-r.left)/sc;
    const p=data.pts.reduce((a,b)=>Math.abs(b.px-px)<Math.abs(a.px-px)?b:a);tip.textContent=p.text;tip.hidden=false;
    const hw=tip.offsetWidth/2;tip.style.left=Math.max(hw,Math.min(r.width-hw,p.px*sc))+'px'};
  el.addEventListener('pointermove',show);el.addEventListener('pointerdown',show);el.addEventListener('pointerleave',()=>tip.hidden=true);
}

/* ---------- sheets ---------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheetbox" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
let askFn=null,plateEx=null;
function ask(title,body,ok,fn,danger){askFn=fn;openSheet(`<h2>${esc(title)}</h2>${body?`<p class="muted">${esc(body)}</p>`:''}<div class="row"><button class="btn grow" data-act="closeSheet">Cancel</button><button class="btn grow ${danger?'danger':'primary'}" data-act="askOk">${esc(ok)}</button></div>`)}
function plateCalc(kgTotal){
  const lb=unit()==='lb',plates=lb?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25],bar=carriageOf(plateEx)?0:lb?(S.profile.settings.bar==20?45:trim(S.profile.settings.bar*LB,0)):+S.profile.settings.bar;
  const total=kgTotal*uf();let side=(total-bar)/2;const use=[];
  if(side<0)return{bar,use,short:total<bar};
  plates.forEach(p=>{while(side>=p-1e-6){use.push(p);side-=p}});
  return{bar,use,left:trim(side*2)};
}
function plateHtml(kg){
  if(!(kg>0))return `<p class="muted">Enter a weight to see the plates.</p>`;
  const c=plateCalc(kg);
  if(c.short)return `<p>That is less than the ${c.bar} ${unit()} bar.</p>`;
  const col=['var(--p25)','var(--p20)','var(--p15)','var(--p10)','var(--p5)','var(--p2)','var(--p1)'],list=unit()==='lb'?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  let x=38;const rects=c.use.map(p=>{const i=list.indexOf(p),h=[110,110,110,110,76,54,42][i+(unit()==='lb'&&i>3?0:0)],w=[20,18,16,14,12,9,7][i];const r=`<rect class="plate" x="${x}" y="${65-h/2}" width="${w}" height="${h}" rx="2" fill="${col[i]}"/>`;x+=w+2;return r}).join('');
  return `<div class="bar"><svg width="${Math.max(x+50,200)}" height="130" role="img" aria-label="Plates on one side of the bar"><rect x="0" y="60" width="${x+44}" height="10" rx="2" fill="var(--muted)"/><rect x="30" y="52" width="8" height="26" fill="var(--muted)"/>${rects}</svg></div>
  <p><b>Each side:</b> <span class="num">${c.use.length?c.use.join(' + '):'empty bar'}</span> ${c.use.length?unit():''}</p>
  <p class="muted small num">${carriageOf(plateEx)?`Plates only. The ${dispW(carriageOf(plateEx))} ${unit()} carriage is on top`:`${c.bar} ${unit()} bar`}${c.left>0?`. ${c.left} ${unit()} short of your target with these plates.`:''}</p>`;
}

/* ---------- active workout ---------- */
function makeSets(ex,template){
  const prev=lastSets(ex),base=template&&template.length?template:prev.length?prev:[{type:'n'}];

    else cell+=c}

    const s={type:typeMap[g('set_type').toLowerCase()]||'n'},w=num(g('weight_kg')),reps=num(g('reps')),t=num(g('duration_seconds')),d=num(g('distance_km'));
    if(w!=='')s.w=w;if(reps!=='')s.r=reps;if(t!=='')s.t=t;if(d!=='')s.d=d;x.sets.push(s);
    if(!known&&![...newEx.keys()].some(n=>n.toLowerCase()===raw.toLowerCase()))newEx.set(raw,d!==''?'cardio':t!==''?'time':'weight');
  });
  return{routines:[...routines.values()],newEx,skipped};
}
function importProgram(txt){
  const p=parseProgram(txt);
  if(!p||!p.routines.length)return ask('That doesn’t look like a program file','It needs a header row with at least routine and exercise columns, and one row per set.','OK',null);
  const same=r=>o=>o.name===r.name&&(o.program||'')===r.program,replaced=p.routines.filter(r=>S.profile.routines.some(same(r))).length,sets=p.routines.reduce((n,r)=>n+r.exercises.reduce((a,x)=>a+x.sets.length,0),0);
  ask(`Import ${p.routines.length} routine${p.routines.length>1?'s':''}?`,`${p.routines.map(r=>r.name).join(', ')}. ${sets} sets.${replaced?` ${replaced} existing routine${replaced>1?'s':''} will be replaced.`:''}${p.newEx.size?` Not in the exercise library, so these will be added as custom: ${[...p.newEx.keys()].join(', ')}.`:''}${p.skipped?` ${p.skipped} incomplete rows skipped.`:''}`,'Import',()=>{
    p.newEx.forEach((type,name)=>S.profile.customExercises.push({name,muscle:type==='cardio'?'Cardio':'Other',type}));
    p.routines.forEach(r=>{const i=S.profile.routines.findIndex(same(r));if(i<0)S.profile.routines.push(r);else{r.id=S.profile.routines[i].id;S.profile.routines[i]=r}});
    saveProfile();tab='train';screens=[];render();scrollTo(0,0);toast('Program imported.');
  });
}
function restore(txt){
  let d;try{d=JSON.parse(txt)}catch{d=null}
  if(!d||!d.profile||!d.workouts)return ask('That isn’t a Liftbook backup','Choose a file made with Export backup.','OK',null);
  ask('Restore this backup?',`It has ${Object.keys(d.workouts).length} workouts and replaces everything in Liftbook now.`,'Restore',()=>{
    S.profile={...S.profile,...d.profile};S.workouts=d.workouts;
    histMemo=null;cache();screens=[];render();toast('Backup restored.')},true);
}
function toCsv(){
  const q=v=>{const s=String(v??'');return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const d=t=>{const x=new Date(t);return `${x.getDate()} ${Object.keys(MON)[x.getMonth()].replace(/^./,c=>c.toUpperCase())} ${x.getFullYear()}, ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`};
  const tn={n:'normal',w:'warmup',d:'dropset',f:'failure'},out=['title,start_time,end_time,description,exercise_title,superset_id,exercise_notes,set_index,set_type,weight_kg,reps,distance_km,duration_seconds,rpe'];
  sortedW().forEach(w=>w.exercises.forEach(x=>x.sets.forEach((s,i)=>out.push([w.title,d(w.start),d(w.end||w.start),w.notes,x.ex,'',x.notes,i,tn[s.type],s.w,s.r,s.d,s.t,''].map(q).join(',')))));
  return out.join('\n');
}

(async()=>{
  try{const saved=await kvGet('state');if(saved){Object.assign(S,saved);S.profile.settings={...DEF_SETTINGS,...S.profile.settings}}}
  catch{toast('This browser is blocking storage, so changes may not be kept.')}
  render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
